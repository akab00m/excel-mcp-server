# Cathalina / OWUI stack deploy. Requires sibling network owui_default and .env
# with EXCEL_MCP_HTTP_TOKEN. Generic sketch: docker-compose.example.yml.
services:
  excel-mcp:
    build:
      context: .
      dockerfile: Dockerfile.cathalina
    image: excel-mcp-server:http
    container_name: excel-mcp
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    environment:
      EXCEL_MCP_TRANSPORT: http
      EXCEL_MCP_HTTP_ADDR: ":8080"
      EXCEL_MCP_HTTP_PATH: /mcp
      EXCEL_MCP_PAGING_CELLS_LIMIT: "4000"
      HOME: /home/cursor-bridge/projects/cursor-cli-bridge/workspace/.excel-mcp-home
    volumes:
      - /home/cursor-bridge/projects/cursor-cli-bridge/workspace:/home/cursor-bridge/projects/cursor-cli-bridge/workspace
      - /home/cursor-bridge/projects/cursor-cli-bridge/project:/home/cursor-bridge/projects/cursor-cli-bridge/project
    ports:
      - "127.0.0.1:3003:8080"
    networks:
      - owui_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  owui_default:
    external: true
